<style>
  .summary-strip {
    display:flex; gap:24px; flex-wrap:wrap;
    padding:14px 20px; background: var(--bg-table-alt);
    border-radius:10px; margin-bottom:18px;
    border:1px solid var(--border-color);
  }
  .s-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color: var(--text-muted); font-weight:700; }
  .s-val   { font-size:18px; font-weight:800; color: var(--text-body); }
  .s-val.green { color:#16A34A; }
  .s-val.red   { color:#DC2626; }
  
  .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .badge-success { background:#DCFCE7; color:#16A34A; }
  .badge-warning  { background:#FEF9C3; color:#CA8A04; }
  .badge-danger   { background:#FEE2E2; color:#DC2626; }
  .badge-draft    { background:#F3F4F6; color:#4B5563; }
  
  .tab { padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600;
         color: var(--text-muted); border:1.5px solid var(--border-color); text-decoration:none; transition:all .15s; }
  .tab:hover { border-color:#012926; color:#F59E0B; }
  .tab.active { background:#012926; color:#F59E0B; border-color:#012926; }
  
  .table-wrap { overflow:auto; max-height:68vh; border-radius:10px; position:relative; }
  table { width:100%; border-collapse:collapse; min-width:820px; }
  thead th {
    padding:11px 14px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.7px;
    color:#F59E0B; background:#012926;
    border-bottom:1.5px solid var(--border-color); text-align:left; white-space:nowrap;
    position:sticky; top:0; z-index:2;
  }
  tbody td { padding:13px 14px; border-bottom:1px solid var(--border-color); font-size:13.5px; vertical-align:middle; color: var(--text-body); }
  tbody tr:hover { background: var(--bg-table-alt); }

  .created-by-cell { font-size:12px; color:var(--text-muted); }
  .created-by-cell .name { color:var(--text-body); font-weight:500; }
  .edited-by-cell { font-size:12px; color:var(--text-muted); }
  .edited-by-cell .name { color:var(--text-body); font-weight:500; }
  .user-email-sub { font-size:10px; color:var(--text-muted); display:block; }

  @media (max-width: 768px) {
    .summary-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
    .page-header { flex-direction: column; align-items: flex-start !important; gap: 10px; }
  }
</style>
