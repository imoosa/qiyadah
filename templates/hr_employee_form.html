{% extends "base.html" %}{% block title %}{{ 'Edit' if employee else 'Add' }} Employee{% endblock %}{% block page_title %}Employee Master{% endblock %}{% block extra_style %}<style>
.hr-wrap{max-width:1500px;margin:0 auto}.hr-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.hr-head h1{font-size:25px;margin:0}.hr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.hr-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:18px}.hr-label{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase}.hr-value{font-size:27px;font-weight:800;margin-top:5px}.hr-table{width:100%;border-collapse:collapse}.hr-table th,.hr-table td{padding:11px;border-bottom:1px solid var(--border-color);text-align:left;font-size:13px}.hr-table th{color:var(--text-muted);font-size:11px;text-transform:uppercase}.hr-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.hr-form label{font-size:12px;font-weight:700}.hr-form input,.hr-form select,.hr-form textarea{width:100%;padding:10px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-input);color:var(--text-body);margin-top:5px}.span3{grid-column:1/-1}.hr-btn{display:inline-flex;padding:10px 15px;border-radius:9px;border:0;background:#F59E0B;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.hr-muted{color:var(--text-muted)}@media(max-width:900px){.hr-grid{grid-template-columns:repeat(2,1fr)}.hr-form{grid-template-columns:1fr}}@media(max-width:520px){.hr-grid{grid-template-columns:1fr}}
</style>{% endblock %}{% block content %}<div class="hr-wrap"><div class="hr-head"><h1>{{ 'Edit Employee' if employee else 'Add Employee' }}</h1><a href="{{ url_for('hr_employees') }}">← Employees</a></div><form method="post" class="hr-card hr-form">
<label>Employee Code *<input name="employee_code" required value="{{ employee.employee_code if employee else '' }}"></label><label>Full Name *<input name="full_name" required value="{{ employee.full_name if employee else '' }}"></label><label>Email<input type="email" name="email" value="{{ employee.email if employee and employee.email else '' }}"></label>
<label>Phone<input name="phone" value="{{ employee.phone if employee and employee.phone else '' }}"></label><label>Alternate Phone<input name="alternate_phone" value="{{ employee.alternate_phone if employee and employee.alternate_phone else '' }}"></label><label>Date of Birth<input type="date" name="date_of_birth" value="{{ employee.date_of_birth.isoformat() if employee and employee.date_of_birth else '' }}"></label>
<label>Gender<select name="gender"><option value="">Select</option>{% for x in ['Male','Female','Other'] %}<option {% if employee and employee.gender==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label>
<label>Department<select name="department_id"><option value="">Select</option>{% for d in departments %}<option value="{{ d.id }}" {% if employee and employee.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>Designation<select name="designation_id"><option value="">Select</option>{% for d in designations %}<option value="{{ d.id }}" {% if employee and employee.designation_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label>
<label>Reporting Manager<select name="manager_id"><option value="">None</option>{% for m in managers %}<option value="{{ m.id }}" {% if employee and employee.manager_id==m.id %}selected{% endif %}>{{ m.full_name }}</option>{% endfor %}</select></label><label>Branch<input name="branch" value="{{ employee.branch if employee and employee.branch else '' }}"></label><label>Joining Date<input type="date" name="joining_date" value="{{ employee.joining_date.isoformat() if employee and employee.joining_date else '' }}" required></label>
<label>Employment Type<select name="employment_type">{% for x in ['Full Time','Part Time','Contract','Intern','Consultant'] %}<option {% if employee and employee.employment_type==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for x in ['Active','Inactive','On Leave','Exited'] %}<option {% if employee and employee.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>PAN<input name="pan_number" value="{{ employee.pan_number if employee and employee.pan_number else '' }}"></label>
<label>Aadhaar<input name="aadhaar_number" value="{{ employee.aadhaar_number if employee and employee.aadhaar_number else '' }}"></label><label>UAN<input name="uan_number" value="{{ employee.uan_number if employee and employee.uan_number else '' }}"></label><label>ESI Number<input name="esi_number" value="{{ employee.esi_number if employee and employee.esi_number else '' }}"></label>
<label>Bank Name<input name="bank_name" value="{{ employee.bank_name if employee and employee.bank_name else '' }}"></label><label>Bank Account<input name="bank_account_number" value="{{ employee.bank_account_number if employee and employee.bank_account_number else '' }}"></label><label>IFSC<input name="bank_ifsc" value="{{ employee.bank_ifsc if employee and employee.bank_ifsc else '' }}"></label>
<label class="span3">Address<textarea name="address">{{ employee.address if employee and employee.address else '' }}</textarea></label><label>City<input name="city" value="{{ employee.city if employee and employee.city else '' }}"></label><label>State<input name="state" value="{{ employee.state if employee and employee.state else '' }}"></label><label>Country<input name="country" value="{{ employee.country if employee and employee.country else (company.country if company else '') }}"></label><label>Pincode<input name="pincode" value="{{ employee.pincode if employee and employee.pincode else '' }}"></label>
<label>Emergency Contact<input name="emergency_contact_name" value="{{ employee.emergency_contact_name if employee and employee.emergency_contact_name else '' }}"></label><label>Emergency Phone<input name="emergency_contact_phone" value="{{ employee.emergency_contact_phone if employee and employee.emergency_contact_phone else '' }}"></label><label class="span3">Notes<textarea name="notes">{{ employee.notes if employee and employee.notes else '' }}</textarea></label>
<div class="span3"><button class="hr-btn">Save Employee</button></div></form></div>{% endblock %}
