<style>
.bi-work{max-width:1440px;margin:auto;padding:20px;font-family:var(--font,'Plus Jakarta Sans',sans-serif);color:var(--text-body,#1E293B)}.bi-hero{background:linear-gradient(135deg,var(--bg-sidebar,#012926),#011A18);color:white;border-radius:18px;padding:26px;margin-bottom:18px;border:1px solid rgba(245,158,11,.35)}.bi-hero small{color:var(--primary,#F59E0B);font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.bi-hero h1{margin:6px 0;font-size:28px;font-weight:800;font-family:var(--font)}.bi-hero p{color:rgba(255,255,255,.78)}.bi-links{display:flex;gap:18px;flex-wrap:wrap}.bi-links a{color:var(--primary,#F59E0B);font-family:var(--font);font-weight:600}.bi-tools{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:18px 0}.bi-tools label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text-body,#1E293B);font-family:var(--font)}.bi-tools input,.bi-tools select{padding:9px 12px;border:1.5px solid var(--border-color,#E2E8F0);border-radius:8px;background:var(--bg-input,#fff);color:var(--text-body,#1E293B);font-family:var(--font);font-size:13px}.bi-work button{padding:9px 18px;background:var(--primary,#F59E0B);color:#fff;border:0;border-radius:8px;cursor:pointer;font-family:var(--font,'Plus Jakarta Sans',sans-serif);font-size:13px;font-weight:600;transition:all .15s}.bi-work button:hover{background:var(--primary-dark,#D97706);color:#fff}.bi-work button:disabled{opacity:.5}.bi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:18px 0}.bi-panel{background:var(--bg-card,#fff);border:1px solid var(--border-color,#E2E8F0);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--shadow-card)}.bi-panel h2{font-size:17px;font-weight:700;color:var(--text-body,#1E293B);margin:0 0 14px;font-family:var(--font)}.bi-panel p,.bi-muted{font-size:13px;color:var(--text-muted,#64748B);line-height:1.6;font-family:var(--font)}.bi-number{font-size:27px;font-weight:800;color:var(--text-body,#1E293B);font-family:var(--fon
